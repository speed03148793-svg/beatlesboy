<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>해양사고 현황 데이터 조회</title>
  <style>
    :root { --bg:#f4f7fb; --card:#fff; --text:#172033; --muted:#687386; --line:#dfe5ee; --primary:#155eef; --primary-soft:#edf3ff; --shadow:0 10px 30px rgba(20,32,51,.08); --radius:18px; }
    *{box-sizing:border-box} html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:"Pretendard","Noto Sans KR","Malgun Gothic",Arial,sans-serif} body{min-width:0}
    .wrap{width:min(1400px,calc(100% - 32px));margin:0 auto;padding:32px 0 48px}.hero{background:linear-gradient(135deg,#173b7a,#155eef);color:#fff;border-radius:24px;padding:28px;margin-bottom:20px;box-shadow:var(--shadow)}
    .hero h1{margin:0 0 8px;font-size:clamp(24px,4vw,40px);line-height:1.2}.hero p{margin:0;opacity:.9;line-height:1.7;font-size:15px}.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:20px;margin-bottom:20px}
    .controls{display:grid;grid-template-columns:minmax(0,1fr) 220px auto;gap:12px;align-items:end}.field label{display:block;font-size:13px;font-weight:700;margin-bottom:7px;color:#3d485a}
    input,select,button{width:100%;min-height:44px;border-radius:12px;border:1px solid #cfd7e3;font:inherit}input,select{padding:0 13px;background:#fff;color:var(--text);outline:none}input:focus,select:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(21,94,239,.12)}button{border:0;background:#172033;color:#fff;padding:0 18px;cursor:pointer;font-weight:700}button:hover{opacity:.92}
    .summary{display:flex;flex-wrap:wrap;gap:10px;margin-top:16px;align-items:center}.badge{display:inline-flex;align-items:center;min-height:34px;padding:0 12px;border-radius:999px;background:var(--primary-soft);color:#1746a2;font-size:13px;font-weight:700}.hint{color:var(--muted);font-size:13px;line-height:1.6}.status{padding:12px 14px;border-radius:12px;background:#fff7e8;border:1px solid #f2d39a;color:#78540a;font-size:13px;margin-top:12px;display:none}
    .table-wrap{width:100%;overflow:visible}table{width:100%;border-collapse:collapse;table-layout:fixed}th,td{border-bottom:1px solid var(--line);padding:11px 9px;text-align:center;font-size:12px;word-break:keep-all}th{background:#f7f9fc;color:#344054;font-weight:800;position:sticky;top:0;z-index:1}tbody tr:hover{background:#f9fbff}.year-cell{font-weight:800;color:#163e8f}.empty{text-align:center;padding:32px 12px;color:var(--muted);font-size:14px}.mobile-list{display:none}.mobile-card{border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px;background:#fff}.mobile-card .card-title{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:10px}.mobile-card .card-title strong{font-size:17px}.mobile-card dl{display:grid;grid-template-columns:1fr 1fr;gap:8px 10px;margin:0}.mobile-card .pair{min-width:0;background:#f7f9fc;border-radius:10px;padding:9px}.mobile-card dt{margin:0 0 4px;color:var(--muted);font-size:11px;line-height:1.3;word-break:keep-all}.mobile-card dd{margin:0;font-weight:800;font-size:14px;word-break:break-word}.source{line-height:1.8;font-size:13px;color:#566176}.source strong{color:#253048}
    @media(max-width:900px){.controls{grid-template-columns:1fr 1fr}.controls .reset-wrap{grid-column:1/-1}table{table-layout:auto}th,td{font-size:11px;padding:10px 6px}}
    @media(max-width:600px){.wrap{width:min(100% - 20px,560px);padding-top:14px}.hero{padding:20px 17px;border-radius:18px}.panel{padding:15px;border-radius:16px}.controls{grid-template-columns:1fr}.controls .reset-wrap{grid-column:auto}.desktop-table{display:none}.mobile-list{display:block}.mobile-card dl{grid-template-columns:1fr 1fr}}
    @media(max-width:400px){.wrap{width:calc(100% - 16px)}.hero h1{font-size:24px}.mobile-card{padding:12px}.mobile-card dl{grid-template-columns:1fr 1fr;gap:7px}.mobile-card .pair{padding:8px}.mobile-card dt{font-size:10px}.mobile-card dd{font-size:13px}}
  </style>
</head>
<body>
  <main class="wrap">
    <section class="hero"><h1>해양사고 현황 데이터 조회</h1><p>연도별 사고 데이터를 검색하고 필터링할 수 있습니다. 사고 유형을 검색하면 해당 사고 유형 중심으로 표와 모바일 카드가 정리됩니다.</p></section>
    <section class="panel">
      <div class="controls">
        <div class="field"><label for="searchInput">검색</label><input id="searchInput" type="search" placeholder="예: 2005, 충돌, 기관손상" autocomplete="off" /></div>
        <div class="field"><label for="yearFilter">연도 필터</label><select id="yearFilter"><option value="">전체 연도</option></select></div>
        <div class="reset-wrap"><button id="resetBtn" type="button">검색·필터 초기화</button></div>
      </div>
      <div class="summary"><span class="badge" id="countBadge">표시 0건 / 전체 0건</span><span class="badge" id="modeBadge">전체 사고 유형</span></div>
      <p class="hint">연도 검색은 해당 연도 행만 표시합니다. 사고 유형 검색은 모든 연도를 유지하면서 해당 사고 유형 열만 중심적으로 보여줍니다.</p>
      <div class="status" id="statusBox"></div>
    </section>
    <section class="panel">
      <div class="table-wrap desktop-table"><table aria-label="해양사고 현황 표"><thead id="tableHead"></thead><tbody id="tableBody"></tbody></table></div>
      <div class="mobile-list" id="mobileList"></div><div class="empty" id="emptyState" hidden>조건에 맞는 데이터가 없습니다.</div>
    </section>
    <section class="panel source"><strong>데이터 출처</strong>: data.json<br><strong>기준 시점</strong>: 1998년 ~ 2012년<br><strong>표시 기준</strong>: JSON의 각 연도 행을 원본 구조대로 표시</section>
  </main>
  <script>
    const searchInput=document.getElementById('searchInput'),yearFilter=document.getElementById('yearFilter'),resetBtn=document.getElementById('resetBtn'),tableHead=document.getElementById('tableHead'),tableBody=document.getElementById('tableBody'),mobileList=document.getElementById('mobileList'),countBadge=document.getElementById('countBadge'),modeBadge=document.getElementById('modeBadge'),emptyState=document.getElementById('emptyState'),statusBox=document.getElementById('statusBox');
    let sourceData=[],allColumns=[];
    function normalize(v){return String(v??'').trim().toLowerCase().replace(/\s+/g,'')}
    async function loadData(){try{const r=await fetch('./data.json',{cache:'no-store'});if(!r.ok)throw new Error();const f=await r.json();if(!Array.isArray(f))throw new Error();sourceData=f}catch(e){statusBox.style.display='block';statusBox.textContent='data.json을 불러오지 못했습니다. index.html과 data.json을 같은 폴더에 두고 웹서버에서 실행해 주세요.';sourceData=[]}allColumns=sourceData.length?Object.keys(sourceData[0]):[];buildYearOptions();applyFilters()}
    function buildYearOptions(){[...new Set(sourceData.map(r=>r['시점']))].filter(v=>v!==undefined&&v!==null).sort((a,b)=>Number(a)-Number(b)).forEach(y=>{const o=document.createElement('option');o.value=String(y);o.textContent=y+'년';yearFilter.appendChild(o)})}
    function getMatchedAccidentColumns(query){const q=normalize(query);if(!q||/^\d{4}$/.test(q))return[];return allColumns.filter(c=>c!=='시점'&&normalize(c).includes(q))}
    function getVisibleColumns(m){if(!m.length)return allColumns;const b=allColumns.includes('총계')?['시점','총계']:['시점'];return[...new Set([...b,...m])]}
    function applyFilters(){const query=searchInput.value.trim(),q=normalize(query),selectedYear=yearFilter.value,matched=getMatchedAccidentColumns(query),cols=getVisibleColumns(matched);let filtered=sourceData.filter(r=>{if(selectedYear&&String(r['시점'])!==selectedYear)return false;if(!q)return true;if(/^\d{4}$/.test(q))return normalize(r['시점'])===q;if(matched.length)return true;return Object.entries(r).some(([k,v])=>normalize(k).includes(q)||normalize(v).includes(q))});renderDesktopTable(filtered,cols);renderMobileCards(filtered,cols);countBadge.textContent=`표시 ${filtered.length}건 / 전체 ${sourceData.length}건`;modeBadge.textContent=matched.length?`사고 유형: ${matched.join(', ')}`:'전체 사고 유형';emptyState.hidden=filtered.length>0}
    function renderDesktopTable(rows,cols){tableHead.innerHTML='';tableBody.innerHTML='';const tr=document.createElement('tr');cols.forEach(c=>{const th=document.createElement('th');th.textContent=c;tr.appendChild(th)});tableHead.appendChild(tr);rows.forEach(r=>{const tr=document.createElement('tr');cols.forEach(c=>{const td=document.createElement('td');td.textContent=r[c]??'';if(c==='시점')td.className='year-cell';tr.appendChild(td)});tableBody.appendChild(tr)})}
    function renderMobileCards(rows,cols){mobileList.innerHTML='';rows.forEach(r=>{const card=document.createElement('article');card.className='mobile-card';const title=document.createElement('div');title.className='card-title';title.innerHTML=`<strong>${r['시점']??'-'}년</strong><span class="badge">총계 ${r['총계']??'-'}</span>`;card.appendChild(title);const dl=document.createElement('dl');cols.filter(c=>c!=='시점'&&c!=='총계').forEach(c=>{const pair=document.createElement('div');pair.className='pair';const dt=document.createElement('dt');dt.textContent=c;const dd=document.createElement('dd');dd.textContent=r[c]??'-';pair.append(dt,dd);dl.appendChild(pair)});card.appendChild(dl);mobileList.appendChild(card)})}
    searchInput.addEventListener('input',applyFilters);yearFilter.addEventListener('change',applyFilters);resetBtn.addEventListener('click',()=>{searchInput.value='';yearFilter.value='';applyFilters();searchInput.focus()});loadData();
  </script>
</body>
</html>
